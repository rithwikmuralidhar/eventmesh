# OPTIONAL, for people who have Docker. Nothing in the project (scripts, tests, gates) depends on this file;
# the supported workflow is native Windows with PostgreSQL and Memurai (docs/windows-setup.md).
services:
  postgres:
    image: postgres:17
    environment: { POSTGRES_USER: eventmesh, POSTGRES_PASSWORD: eventmesh, POSTGRES_DB: eventmesh }
    ports: ['127.0.0.1:5432:5432']
    healthcheck: { test: ['CMD-SHELL', 'pg_isready -U eventmesh'], interval: 5s, timeout: 5s, retries: 10 }
  redis:
    image: redis:7
    ports: ['127.0.0.1:6379:6379']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 5s, retries: 10 }
